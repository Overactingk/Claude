# Windows용 실행 파일(exe) 빌드 — 결과물은 Actions 실행 화면의 'Artifacts'에서 zip으로 다운로드
name: Windows exe 빌드

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 패키지 설치
        run: pip install -r requirements.txt pyinstaller
      - name: 테스트 (Windows 경로·한글 파일명 포함)
        run: python -m pytest -q
      - name: exe 빌드 (폴더형: 백신 오탐이 적고 실행이 빠름)
        run: >
          pyinstaller --noconfirm --onedir --name jeonjang_tasks
          --add-data "app/templates;app/templates"
          --add-data "app/static;app/static"
          run.py
      - name: 배포 파일 모으기
        shell: pwsh
        run: |
          Copy-Item config.example.ini, seed_tasks.json, 사용안내.md dist/jeonjang_tasks/
          Copy-Item tools/*.bat dist/jeonjang_tasks/
      - uses: actions/upload-artifact@v4
        with:
          name: jeonjang_tasks-windows
          path: dist/jeonjang_tasks/
